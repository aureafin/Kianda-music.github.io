}

<body>

<header class="hero-header">
  <img src="assets/images/logo.png" alt="Kianda Music" class="brand-logo">

    <div class="tagline">Ouve e descarrega as músicas mais recentes, de graça.</div>

<div class="translate-bar"><div id="google_translate_element"></div></div>


<div class="search-bar-wrap">
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Pesquisar músicas ou artistas...">
    <button class="search-icon-btn" id="search-btn" aria-label="Pesquisar">🔍</button>
  </div>
</div>

<nav class="chip-row" style="padding-top:0;">
  <a href="novidades/" class="chip">🆕 Novidades</a>

</nav>

<div id="song-list">

    <div class="skeleton-card"><div class="cover-wrap"></div><div class="info"><div class="line"></div><div class="line short"></div></div></div>

    <div class="skeleton-card"><div class="cover-wrap"></div><div class="info"><div class="line"></div><div class="line short"></div></div></div>
  </div>
</div>

<div id="load-more-wrap" style="text-align:center; margin:4px 0 20px;">
  <button id="load-more-btn" class="btn-play" style="display:none;">Carregar mais</button>
</div>

<footer class="site-footer">
  <a href="termos/">Termos</a>

<div class="footer-contact">
  Kianda Music · Contacto: <strong>+244 954 972 677</strong>
</div>
