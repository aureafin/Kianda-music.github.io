<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{META_TITLE}}</title>
<meta name="description" content="{{META_DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL_URL}}">
<meta name="robots" content="index, follow">

<meta property="og:type" content="website">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{META_DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{OG_TITLE}}">
<meta name="twitter:description" content="{{META_DESCRIPTION}}">

<link rel="stylesheet" href="{{ASSETS_PATH}}/assets/css/style.css">
<link rel="icon" href="{{ASSETS_PATH}}/assets/images/logo.png">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "name": "{{GENRE_NAME_JSON}}",
  "url": "{{CANONICAL_URL}}"
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type":"ListItem","position":1,"name":"Início","item":"{{SITE_URL}}/"},
    {"@type":"ListItem","position":2,"name":"Géneros","item":"{{SITE_URL}}/categorias/"},
    {"@type":"ListItem","position":3,"name":"{{GENRE_NAME_JSON}}","item":"{{CANONICAL_URL}}"}
  ]
}
</script>
</head>
<body>
<header class="site-header">
  <a href="{{ASSETS_PATH}}/" class="logo notranslate" translate="no"><img src="{{ASSETS_PATH}}/assets/images/logo.png" alt="{{SITE_NAME}}">{{SITE_NAME}}</a>
</header>

<nav class="breadcrumbs" aria-label="breadcrumb">
  <a href="{{ASSETS_PATH}}/">Início</a> ›
  <a href="{{ASSETS_PATH}}/categorias/">Géneros</a> ›
  <span class="notranslate" translate="no">{{GENRE_NAME_HTML}}</span>
</nav>

<div class="page-heading">
  <h1>Música <span class="notranslate" translate="no">{{GENRE_NAME_HTML}}</span></h1>
  <p>{{INTRO_HTML}}</p>
</div>

<div class="section-title">
  <h2>{{SONGS_COUNT}} música(s) de <span class="notranslate" translate="no">{{GENRE_NAME_HTML}}</span></h2>
  <a href="{{BROWSE_ALL_URL}}">Ver todas ›</a>
</div>

<div class="song-grid">
{{SONGS_LIST_HTML}}
</div>

<footer class="site-footer">
  <a href="{{ASSETS_PATH}}/termos/">Termos</a>
  <a href="{{ASSETS_PATH}}/privacidade/">Privacidade</a>
  <a href="{{ASSETS_PATH}}/copyright/">Copyright</a>
  <a href="{{ASSETS_PATH}}/contacto/">Contacto</a>
  <a href="{{ASSETS_PATH}}/equipa/">Equipa</a>
</footer>
<div class="footer-contact">{{SITE_NAME}} · Contacto: <strong>+244 954 972 677</strong></div>

</body>
</html>
