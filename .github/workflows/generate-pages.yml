name: Gerar Páginas de Músicas

# Disparado de 3 formas:
# 1) repository_dispatch -> chamado pelo Supabase Database Webhook
#    (ou pelo Worker) sempre que uma música é criada/editada/apagada.
# 2) workflow_dispatch -> botão manual "Run workflow" no GitHub.
# 3) schedule -> rede de segurança, corre 1x por dia mesmo que
#    algum webhook falhe.
on:
  repository_dispatch:
    types: [songs-updated]
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install @supabase/supabase-js

      - name: Gerar páginas HTML
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SITE_NAME: ${{ secrets.SITE_NAME }}
        run: node scripts/generate-pages.js

      - name: Commit e push automático
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add musica/ artista/ genero/ novidades/ mais-baixadas/ mais-ouvidas/ sitemap.xml sitemap-musicas.xml sitemap-artistas.xml sitemap-generos.xml sitemap-paginas.xml
          git diff --cached --quiet && echo "Nada para commitar" && exit 0
          git commit -m "chore: atualizar páginas de músicas automaticamente"
          git push
